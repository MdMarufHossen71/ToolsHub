<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No `maximum-scale`: capping it blocks pinch zoom, which WCAG 2.2 1.4.4 requires. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolsHub — Browser Workbench</title>
    <meta
      name="description"
      content="Free browser tools and games that run entirely on your device. No accounts, no tracking, no uploads." />
    <!-- Pre-JavaScript defaults for the home page. `usePageMeta` updates these in
         place per route (and the prerendered shells carry their own copies), so a
         social crawler that never runs scripts still gets a complete card. -->
    <link rel="canonical" href="https://tools-hub-71.vercel.app/" />
    <link rel="alternate" hreflang="en" href="https://tools-hub-71.vercel.app/" />
    <link rel="alternate" hreflang="bn" href="https://tools-hub-71.vercel.app/bn/" />
    <link rel="alternate" hreflang="x-default" href="https://tools-hub-71.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ToolsHub" />
    <meta property="og:title" content="ToolsHub — Browser Workbench" />
    <meta property="og:description" content="Free browser tools and games that run entirely on your device. No accounts, no tracking, no uploads." />
    <meta property="og:url" content="https://tools-hub-71.vercel.app/" />
    <meta property="og:image" content="https://tools-hub-71.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ToolsHub — Browser Workbench" />
    <meta name="twitter:description" content="Free browser tools and games that run entirely on your device. No accounts, no tracking, no uploads." />
    <meta name="twitter:image" content="https://tools-hub-71.vercel.app/og-image.png" />
    <meta name="color-scheme" content="light dark" />
    <!-- Relative `./` paths, like every other asset: the build sets `base: "./"` so
         the same files work at a domain root, on a preview URL and from a subpath. -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <!-- Installable app: relative href like every other asset, so the same build
         installs from a domain root, a preview URL or a subpath. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS ignores the manifest's display mode and needs these three explicitly.
         `default` keeps the status bar legible on the paper-light surface. The
         standard `mobile-web-app-capable` sits next to the Apple one because Chromium
         logs a console deprecation warning when only the vendor-prefixed tag is
         present, and a clean console is part of this project's checks. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ToolsHub" />
    <!-- The browser chrome matches the active paper/ink field before any script runs. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a1025" />
    <!-- Fonts are self-hosted via Fontsource and bundled by Vite (see
         `client/src/fonts.css`): no third-party font request, fully offline-capable
         once cached. `display=swap` behaviour is preserved by Fontsource CSS. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
