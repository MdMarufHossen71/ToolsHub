name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run audit:security
      - run: corepack pnpm run check
      - run: corepack pnpm run lint
      - run: corepack pnpm run test:coverage
      - run: node scripts/i18n-parity.mjs
      - run: node scripts/theme-contrast.mjs
      - run: corepack pnpm run build
      - run: corepack pnpm run budget
      - run: node scripts/shell-audit.mjs
      - run: corepack pnpm run audit:csp
